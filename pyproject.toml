[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d3d-decoding"
version = "0.1.0"
description = "D3D: Decoupled Diffusion Drafting for Asynchronous Speculative Decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.entry-points."sglang.srt.plugins"]
d3d_strict = "inference.sglang.plugin:register"

[project.urls]
Homepage = "https://github.com/fudan-generative-vision/D3D"
Repository = "https://github.com/fudan-generative-vision/D3D"
Models = "https://huggingface.co/collections/fudan-generative-ai/d3d"

[tool.setuptools.packages.find]
include = ["inference*", "training*", "common*"]
namespaces = true

[tool.setuptools.package-data]
"training.model" = ["config.json"]
